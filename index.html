.brand{text-align:center;margin-top:26px;margin-bottom:42px}

.download-btn:nth-child(2){animation-delay:.12s}.download-btn:nth-child(3){animation-delay:.24s}
.download-btn:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(20,255,90,.08),transparent);transform:translateX(-100%);transition:.5s}
.download-btn:hover:before{transform:translateX(100%)}
.download-btn:hover{transform:translateY(-3px);border-color:#20ff68;box-shadow:0 0 28px rgba(20,255,90,.2),inset 0 0 24px rgba(20,255,90,.05)}
.download-btn:active{transform:scale(.98)}
@keyframes appear{to{opacity:1;transform:translateY(0)}}
.icon{width:44px;height:44px;flex:none;margin-right:17px;filter:drop-shadow(0 0 8px rgba(25,255,100,.5));animation:spin 4s linear infinite}

.arrow{margin-left:auto;color:#24ff68;font-size:22px}
.info{position:fixed;left:22px;bottom:18px;z-index:3;color:#63ff8e;font:10px/1.65 monospace;opacity:.65}
.info b{color:#b4ffc8}
.loader{position:fixed;inset:0;background:#000;z-index:20;display:flex;align-items:center;justify-content:center;transition:opacity .55s,visibility .55s}
.loader.hide{opacity:0;visibility:hidden}
.loader-inner{text-align:center}
.loader-logo{width:64px;filter:drop-shadow(0 0 15px #19ff66);animation:spin 1.8s linear infinite}
.loader-inner p{margin-top:18px;font:700 10px monospace;letter-spacing:4px;color:#38ff75}
.loader-bar{width:150px;height:2px;background:#0a3218;margin:15px auto 0;overflow:hidden}
.loader-bar i{display:block;width:40%;height:100%;background:#1cff67;animation:load 1s infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
@media(max-width:600px){

@media(prefers-reduced-motion:reduce){
